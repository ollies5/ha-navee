name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements_test.txt ruff
          python - <<'PY' > ha_bluetooth_requirements.txt
          import json, pathlib, homeassistant
          root = pathlib.Path(homeassistant.__file__).parent / "components"
          for name in ("bluetooth", "usb", "bluetooth_adapters"):
              for req in json.loads((root / name / "manifest.json").read_text()).get("requirements", []):
                  print(req)
          PY
          pip install -r ha_bluetooth_requirements.txt
      - name: Lint
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Test
        run: python -m pytest -q
